<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Tropical coast at night"><title>Tropical coast at night</title><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071A24"/><stop offset=".6" stop-color="#12394A"/><stop offset="1" stop-color="#2C5A66"/></linearGradient><style>.st{animation:tw 3.5s ease-in-out infinite}.st:nth-child(2n){animation-duration:5s;animation-delay:1s}.st:nth-child(3n){animation-delay:2s}.w1{animation:sw 8s ease-in-out infinite alternate}@keyframes tw{50%{opacity:.25}}@keyframes sw{from{transform:translateX(-30px)}to{transform:translateX(30px)}}@media (prefers-reduced-motion:reduce){.st,.w1{animation:none}}</style></defs><rect width="1200" height="600" fill="url(#sky)"/><g fill="#EAF6F7"><circle class="st" cx="120" cy="80" r="2"/><circle class="st" cx="260" cy="150" r="1.6"/><circle class="st" cx="420" cy="60" r="2"/><circle class="st" cx="560" cy="120" r="1.4"/><circle class="st" cx="700" cy="50" r="2"/><circle class="st" cx="980" cy="110" r="1.8"/><circle class="st" cx="1100" cy="60" r="1.5"/><circle class="st" cx="820" cy="170" r="1.4"/></g><circle cx="900" cy="170" r="46" fill="#F4F1DE"/><circle cx="918" cy="160" r="40" fill="#12394A"/><path d="M0 420C100 360 170 300 260 300C340 300 380 360 450 372C530 386 570 300 650 280C720 262 780 330 850 360C940 400 1040 340 1120 300C1160 282 1190 290 1200 296V600H0Z" fill="#0F2F3D"/><path d="M0 480C90 430 170 420 260 440C360 462 420 410 520 396C640 380 700 440 800 450C900 460 1010 410 1200 440V600H0Z" fill="#0B2530"/><g class="w1"><path d="M-60 520Q40 490 140 520T340 520T540 520T740 520T940 520T1140 520T1340 520V600H-60Z" fill="#1E5C6B" opacity=".8"/></g><path d="M-60 550Q40 525 140 550T340 550T540 550T740 550T940 550T1140 550T1340 550V600H-60Z" fill="#071A24"/></svg>
