<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Tropical coast at daytime"><title>Tropical coast at daytime</title><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FC9D6"/><stop offset=".6" stop-color="#BFE9F2"/><stop offset="1" stop-color="#FFE3C8"/></linearGradient><radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".5" stop-color="#FFC27A"/><stop offset="1" stop-color="#FF7A59" stop-opacity="0"/></radialGradient><style>.cl1{animation:d1 60s linear infinite}.cl2{animation:d1 90s linear infinite reverse}.sn{animation:pulse 6s ease-in-out infinite;transform-origin:880px 250px}.w1{animation:sw 7s ease-in-out infinite alternate}.w2{animation:sw 9s ease-in-out infinite alternate-reverse}@keyframes d1{from{transform:translateX(-120px)}to{transform:translateX(120px)}}@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}@keyframes sw{from{transform:translateX(-30px)}to{transform:translateX(30px)}}@media (prefers-reduced-motion:reduce){.cl1,.cl2,.sn,.w1,.w2{animation:none}}</style></defs><rect width="1200" height="600" fill="url(#sky)"/><circle class="sn" cx="880" cy="250" r="150" fill="url(#sun)"/><circle cx="880" cy="250" r="46" fill="#FFF4D6"/><g class="cl1" fill="#fff" opacity=".9"><ellipse cx="260" cy="130" rx="90" ry="24"/><ellipse cx="220" cy="112" rx="46" ry="26"/><ellipse cx="290" cy="104" rx="56" ry="32"/></g><g class="cl2" fill="#fff" opacity=".75"><ellipse cx="720" cy="80" rx="80" ry="20"/><ellipse cx="690" cy="64" rx="40" ry="22"/><ellipse cx="752" cy="58" rx="48" ry="28"/></g><path d="M0 420C100 360 170 300 260 300C340 300 380 360 450 372C530 386 570 300 650 280C720 262 780 330 850 360C940 400 1040 340 1120 300C1160 282 1190 290 1200 296V600H0Z" fill="#2F9AA4"/><path d="M0 480C90 430 170 420 260 440C360 462 420 410 520 396C640 380 700 440 800 450C900 460 1010 410 1200 440V600H0Z" fill="#0E7C86"/><g fill="#0A5C64"><path d="M120 520C128 450 120 390 140 330L150 332C132 392 140 452 136 520Z"/><g transform="translate(145 330)"><path d="M0 0C-34-26-76-26-118 4C-80-12-38-10 0 0Z"/><path d="M0 0C-26-44-68-60-110-52C-72-42-34-26 0 0Z"/><path d="M0 0C8-46 34-76 76-84C46-58 22-34 0 0Z"/><path d="M0 0C38-26 84-22 122 12C84-4 42-6 0 0Z"/></g></g><g class="w1"><path d="M-60 520Q40 490 140 520T340 520T540 520T740 520T940 520T1140 520T1340 520V600H-60Z" fill="#3FB6C1" opacity=".85"/></g><g class="w2"><path d="M-60 550Q40 525 140 550T340 550T540 550T740 550T940 550T1140 550T1340 550V600H-60Z" fill="#0A5C64"/></g></svg>
